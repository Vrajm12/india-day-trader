name: NSE Rs 500 Rotation Phone Alerts

# NOTE: GitHub's built-in `schedule:` cron was removed because GitHub Actions
# delayed scheduled runs by 10+ hours (firing 15:03 IST alerts at 01:47 AM IST).
# Trigger this workflow on exact IST minutes via free cron-job.org (see CRON_SETUP.md)
# or manually from the GitHub Actions tab.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Brief mode to run right now'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - premarket
          - orb
          - close_reminder
          - day_end

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run NSE Morning Brief & Notify Phone
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_CALLMEBOT_KEY: ${{ secrets.WHATSAPP_CALLMEBOT_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          echo "Running mode: $MODE"
          python3 scripts/morning_brief.py --mode "$MODE"
